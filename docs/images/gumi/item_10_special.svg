    <path d="M 22 26 L 15 12 L 24 30 Z" fill="url(#earPinkGrad)"/>
    <path d="M 78 26 L 85 12 L 76 30 Z" fill="url(#earPinkGrad)"/>
    <path d="M 50 19 C 40 19 32 23 26 28 L 18 14 L 28 35 C 18 42 10 53 10 66 C 10 82 28 92 50 92 C 72 92 90 82 90 66 C 90 53 82 42 72 35 L 82 14 L 74 28 C 68 23 60 19 50 19 Z" 
          fill="none" stroke="url(#highlightGrad)" stroke-width="2.5" opacity="0.8"/>
    
    <ellipse cx="18" cy="65" rx="9" ry="6" fill="#FF8FAB" opacity="0.95"/>
    <ellipse cx="80" cy="65" rx="7" ry="4" fill="#FFB6C1" opacity="0.8"/>

    <polyline points="25,55 35,59 25,63" fill="none" stroke="#757575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="75,55 65,59 75,63" fill="none" stroke="#757575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="48,64 52,64 50,67" fill="#FF8FAB"/>
    <path d="M 42 68 C 42 76, 58 76, 58 68" fill="none" stroke="#757575" stroke-width="2.5" stroke-linecap="round"/>

    <g stroke="#BDBDBD" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="62" x2="2" y2="60"/>
      <line x1="12" y1="66" x2="1" y2="66"/>
      <line x1="12" y1="70" x2="2" y2="72"/>
      <line x1="88" y1="62" x2="98" y2="60"/>
      <line x1="88" y1="66" x2="99" y2="66"/>
      <line x1="88" y1="70" x2="98" y2="72"/>
    </g>
    <ellipse cx="28" cy="30" rx="8" ry="3.5" transform="rotate(-35 28 30)" fill="#FFFFFF" opacity="0.9"/>
  </g>


  <path d="M 50 28 
           C 40 12, 14 12, 12 35 
           C 12 45, 25 55, 50 68 
           C 75 55, 88 45, 88 35 
           C 86 12, 60 12, 50 28 Z" 
