<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="gummyRedGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD1D6"/>
      <stop offset="35%" stop-color="#FF6B77"/>
      <stop offset="75%" stop-color="#CC1A2A"/>
      <stop offset="100%" stop-color="#AA0010"/>
    </radialGradient>

    <radialGradient id="gummyGreenGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <path id="berry-base" d="M 50 98 C 25 90, 2 65, 2 40 C 2 15, 20 5, 50 15 C 80 5, 98 15, 98 40 C 98 65, 75 90, 50 98 Z"/>
    
    <path id="berry-rim" d="M 50 92 C 30 85, 8 62, 8 40 C 8 20, 25 10, 50 18 C 75 10, 92 20, 92 40 C 92 62, 70 85, 50 92 Z"/>

    <g id="berry-leaves">
      <path d="M 50 15 C 50 15, 60 2, 85 2 C 75 10, 65 15, 50 15 Z"/>
      <path d="M 50 15 C 50 15, 40 2, 15 2 C 25 10, 35 15, 50 15 Z"/>
      <path d="M 50 15 C 50 15, 60 25, 50 35 C 40 25, 50 15, 50 15 Z"/>
    </g>

    <g id="berry-seeds" fill="#FFF59D" stroke="#CC1A2A" stroke-width="1.5">
      <ellipse cx="35" cy="40" rx="2.5" ry="3.5" transform="rotate(15 35 40)"/>
      <ellipse cx="65" cy="40" rx="2.5" ry="3.5" transform="rotate(-15 65 40)"/>
      <ellipse cx="50" cy="55" rx="2.5" ry="3.5"/>
      <ellipse cx="28" cy="62" rx="2" ry="3" transform="rotate(10 28 62)"/>
      <ellipse cx="72" cy="62" rx="2" ry="3" transform="rotate(-10 72 62)"/>
      <ellipse cx="40" cy="75" rx="1.5" ry="2.5" transform="rotate(5 40 75)"/>
      <ellipse cx="60" cy="75" rx="1.5" ry="2.5" transform="rotate(-5 60 75)"/>
      <ellipse cx="50" cy="30" rx="1.5" ry="2"/>
    </g>

    <g id="berry-highlights">
      <path d="M 15 35 C 15 25, 30 15, 50 20 C 30 25, 15 30, 15 35 Z" fill="url(#highlightGrad)" opacity="0.4"/>
      <ellipse cx="22" cy="28" rx="8" ry="4" transform="rotate(-40 22 28)" fill="#FFFFFF" opacity="0.95"/>
      <ellipse cx="12" cy="42" rx="3.5" ry="1.75" transform="rotate(-65 12 42)" fill="#FFFFFF" opacity="0.9"/>
      <ellipse cx="28" cy="22" rx="2" ry="1" transform="rotate(-40 28 22)" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </defs>

  <use href="#berry-base" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)" fill="#AA0010" stroke="#AA0010" stroke-width="4.5" stroke-linejoin="round"/>
  <use href="#berry-base" transform="translate(20, 13) scale(0.78) rotate(20 50 50)" fill="#AA0010" stroke="#AA0010" stroke-width="4.5" stroke-linejoin="round"/>

  <use href="#berry-base" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)" fill="url(#gummyRedGrad)"/>
  <use href="#berry-base" transform="translate(20, 13) scale(0.78) rotate(20 50 50)" fill="url(#gummyRedGrad)"/>

  <use href="#berry-rim" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)" fill="none" stroke="url(#highlightGrad)" stroke-width="3" opacity="0.7"/>
  <use href="#berry-rim" transform="translate(20, 13) scale(0.78) rotate(20 50 50)" fill="none" stroke="url(#highlightGrad)" stroke-width="3" opacity="0.7"/>

  <use href="#berry-seeds" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)"/>
  <use href="#berry-seeds" transform="translate(20, 13) scale(0.78) rotate(20 50 50)"/>

  <use href="#berry-leaves" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)" fill="url(#gummyGreenGrad)" stroke="#2E7D32" stroke-width="2.5" stroke-linejoin="round"/>
  <use href="#berry-leaves" transform="translate(20, 13) scale(0.78) rotate(20 50 50)" fill="url(#gummyGreenGrad)" stroke="#2E7D32" stroke-width="2.5" stroke-linejoin="round"/>

  <use href="#berry-highlights" transform="translate(2, 9) scale(0.78) rotate(-20 50 50)"/>
  <use href="#berry-highlights" transform="translate(20, 13) scale(0.78) rotate(20 50 50)"/>
</svg>
