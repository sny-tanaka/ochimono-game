<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="heartSoftGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </radialGradient>

    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="20%" stop-color="#FFAB40"/>
      <stop offset="40%" stop-color="#FFEA00"/>
      <stop offset="60%" stop-color="#69F0AE"/>
      <stop offset="80%" stop-color="#448AFF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>

    <radialGradient id="gummyRedGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD1D6"/>
      <stop offset="35%" stop-color="#FF6B77"/>
      <stop offset="75%" stop-color="#CC1A2A"/>
      <stop offset="100%" stop-color="#AA0010"/>
    </radialGradient>
    <radialGradient id="gummyGreenGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>

    <radialGradient id="gummyWhiteGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FAFAFA"/>
      <stop offset="75%" stop-color="#EEEEEE"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </radialGradient>
    <radialGradient id="earPinkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </radialGradient>

    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <path id="sparkle" d="M 0 -8 C 0 -2, 2 0, 8 0 C 2 0, 0 2, 0 8 C 0 2, -2 0, -8 0 C -2 0, 0 -2, 0 -8 Z"/>
  </defs>

  <path d="M 50 25 
           C 50 5, 2 5, 2 40 
           C 2 68, 50 96, 50 96 
           C 50 96, 98 68, 98 40 
           C 98 5, 50 5, 50 25 Z" 
        fill="url(#heartSoftGrad)" 
        stroke="url(#rainbowGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round"/>

  <path d="M 50 28 
           C 48 10, 8 10, 8 40 
           C 8 64, 50 90, 50 90 
           C 50 90, 92 64, 92 40 
           C 92 10, 52 10, 50 28 Z" 
        fill="none" 
        stroke="url(#highlightGrad)" 
        stroke-width="3.5" 
        opacity="0.9"/>


  <g transform="translate(10.5, 36.5) scale(0.45) rotate(15 50 50)">
    <path d="M 50 98 C 25 90, 2 65, 2 40 C 2 15, 20 5, 50 15 C 80 5, 98 15, 98 40 C 98 65, 75 90, 50 98 Z" 
          fill="url(#gummyRedGrad)" stroke="#AA0010" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 50 92 C 30 85, 8 62, 8 40 C 8 20, 25 10, 50 18 C 75 10, 92 20, 92 40 C 92 62, 70 85, 50 92 Z" 
