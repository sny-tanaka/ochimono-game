    <path d="M 50 15 C 38 15 28 19 21 26 L 12 6 L 24 33 C 13 41 6 53 6 66 C 6 86 26 96 50 96 C 74 96 94 86 94 66 C 94 53 87 41 76 33 L 88 6 L 79 26 C 72 19 62 15 50 15 Z" 
