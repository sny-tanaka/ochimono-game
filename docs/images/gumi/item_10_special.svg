      <ellipse cx="65" cy="40" rx="3" ry="4" transform="rotate(-15 65 40)"/>
      <ellipse cx="50" cy="55" rx="3" ry="4"/>
      <ellipse cx="28" cy="62" rx="2.5" ry="3.5" transform="rotate(10 28 62)"/>
      <ellipse cx="72" cy="62" rx="2.5" ry="3.5" transform="rotate(-10 72 62)"/>
      <ellipse cx="50" cy="30" rx="2" ry="3"/>
    </g>
    <g fill="url(#gummyGreenGrad)" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round">
      <path d="M 50 15 C 50 15, 60 2, 85 2 C 75 10, 65 15, 50 15 Z"/>
      <path d="M 50 15 C 50 15, 40 2, 15 2 C 25 10, 35 15, 50 15 Z"/>
      <path d="M 50 15 C 50 15, 60 25, 50 35 C 40 25, 50 15, 50 15 Z"/>
    </g>
    <ellipse cx="22" cy="28" rx="8" ry="4" transform="rotate(-40 22 28)" fill="#FFFFFF" opacity="0.95"/>
  </g>


