        opacity="0.3"/>
  
  <ellipse cx="22" cy="26" rx="9" ry="4.5" transform="rotate(-40 22 26)" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="12" cy="38" rx="4" ry="2" transform="rotate(-65 12 38)" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="78" cy="26" rx="6" ry="3" transform="rotate(40 78 26)" fill="#FFFFFF" opacity="0.8"/>


  <use href="#sparkle" transform="translate(20, 20) scale(1.1) rotate(15)" fill="url(#rainbowGrad)"/>
  <use href="#sparkle" transform="translate(82, 22) scale(0.9) rotate(-10)" fill="url(#goldGrad)"/>
  <use href="#sparkle" transform="translate(15, 65) scale(0.8) rotate(45)" fill="url(#goldGrad)"/>
  <use href="#sparkle" transform="translate(85, 68) scale(1.2) rotate(-20)" fill="url(#rainbowGrad)"/>
  <use href="#sparkle" transform="translate(50, 88) scale(0.7)" fill="url(#goldGrad)"/>
</svg>
